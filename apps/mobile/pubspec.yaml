name: takwa
description: 'تطبيق تقوى - تطبيق إسلامي يومي للمحاسبة والمتابعة'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  meta: ^1.19.0

  # ── Shared domain logic & design system (workspace packages) ──
  takwa_core:
    path: ../../packages/takwa_core
  takwa_ui:
    path: ../../packages/takwa_ui

  # ── State Management ──
  flutter_riverpod: ^2.5.1

  # ── Database (Drift/SQLite) ──
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── Calendar ──
  hijri: ^3.0.0

  flutter_localizations:
    sdk: flutter

  # ── Charts ──
  fl_chart: ^1.2.0

  # ── Notifications ──
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # ── Prayer Times ──
  adhan: ^2.0.0+1

  # ── Location ──
  geolocator: ^14.0.2
  flutter_compass: ^0.8.0

  # ── Permissions ──
  permission_handler: ^12.0.1

  # ── Utils ──
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

  # ── Supabase (Cloud Sync) ──
  supabase_flutter: ^2.11.0
  google_sign_in: ^6.2.1

  # ── Connectivity ──
  connectivity_plus: ^7.1.1 # detect online/offline

  # ── Environment Variables ──
  flutter_dotenv: ^6.0.0
  geocoding: ^4.0.0

  # ── Quran & Audio ──
  quran_library: ^4.0.0
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  scrollable_positioned_list: ^0.3.8

  # ── PDF and Images ──
  syncfusion_flutter_pdfviewer: ^28.1.41
  cached_network_image: ^3.4.1

  # ── Adhan Background & UI ──
  flutter_foreground_task: ^8.13.0
  wakelock_plus: ^1.2.10
  flutter_windowmanager_plus: ^1.0.1
  flutter_overlay_window: ^0.5.0
  http: ^1.6.0
  speech_to_text: ^7.3.0
  flutter_tts: ^3.8.5

  share_plus: ^7.2.2
  sound_mode: ^3.0.1
  custom_refresh_indicator: ^4.0.1
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/
    - .env
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
