name: muhasabah
description: 'تطبيق محاسبة النفس - تطبيق إسلامي يومي'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management ──
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Database (Drift/SQLite) ──
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── UI & Fonts ──
  google_fonts: ^6.2.1

  # ── Date & Time ──
  intl: ^0.20.2
  hijri: ^3.0.0
  flutter_localizations:
    sdk: flutter

  # ── Charts ──
  fl_chart: ^0.69.0

  # ── Notifications ──
  flutter_local_notifications: ^17.2.4

  # ── Utils ──
  shared_preferences: ^2.3.2

  # ── Supabase (Cloud Sync) ──
  supabase_flutter: ^2.11.0

  # ── Connectivity ──
  connectivity_plus: ^6.0.3 # detect online/offline

  # ── Environment Variables ──
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - .env
