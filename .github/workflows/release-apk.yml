name: Build & Upload APK to Supabase

on:
    push:
        tags:
            - "v*.*.*" # Triggers when you push a tag like v1.0.0
    workflow_dispatch:
        inputs:
            version:
                description: "Version tag (e.g., 1.0.0)"
                required: true
                default: "1.0.0"

jobs:
    build-and-upload:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/mobile

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Extract Version
              id: get_version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
                  else
                    VERSION=${GITHUB_REF#refs/tags/v}
                    echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
                  fi

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  flutter-version: "3.47.2"
                  cache: true

            - name: Install dependencies
              run: flutter pub get

            # Setup environment variables for Flutter build
            - name: Create .env
              run: |
                  cat > .env <<'EOF'
                  SUPABASE_URL=${{ secrets.SUPABASE_URL }}
                  SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
                  EOF

            - name: Build Android APK
              run: flutter build apk --release --build-name=${{ steps.get_version.outputs.VERSION }}

            - name: Compute Checksums & Rename APK
              id: checksums
              run: |
                  VERSION="${{ steps.get_version.outputs.VERSION }}"
                  APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
                  TARGET_FILE="takwa-v${VERSION}.apk"

                  cp "$APK_PATH" "$TARGET_FILE"

                  SHA256=$(sha256sum "$TARGET_FILE" | awk '{print $1}')
                  SHA1=$(sha1sum "$TARGET_FILE" | awk '{print $1}')

                  echo "SHA256: $SHA256"
                  echo "SHA1: $SHA1"

                  echo "TARGET_FILE=$TARGET_FILE" >> $GITHUB_OUTPUT
                  echo "SHA256=$SHA256" >> $GITHUB_OUTPUT
                  echo "SHA1=$SHA1" >> $GITHUB_OUTPUT

            - name: Upload APK to Supabase Storage
              run: |
                  VERSION="${{ steps.get_version.outputs.VERSION }}"
                  FILE_NAME="${{ steps.checksums.outputs.TARGET_FILE }}"
                  BUCKET="releases"

                  echo "Uploading $FILE_NAME to Supabase Storage ($BUCKET)..."

                  HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
                    -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/${BUCKET}/${FILE_NAME}" \
                    -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                    -H "Content-Type: application/vnd.android.package-archive" \
                    -H "x-upsert: true" \
                    --data-binary "@${FILE_NAME}")

                  if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 201 ]; then
                    echo "Upload failed with status $HTTP_CODE"
                    cat response.json
                    exit 1
                  fi

                  echo "Successfully uploaded $FILE_NAME to Supabase Storage!"

            - name: Create GitHub Release (Optional)
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  files: apps/mobile/${{ steps.checksums.outputs.TARGET_FILE }}
                  body: |
                      ### Takwa v${{ steps.get_version.outputs.VERSION }}

                      **SHA-256:** `${{ steps.checksums.outputs.SHA256 }}`
                      **SHA-1:** `${{ steps.checksums.outputs.SHA1 }}`
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}